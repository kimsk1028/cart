<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3가족 펜션 장보기 & 자동 정산</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

      background-color: #f4f6f9;
      -webkit-tap-highlight-color: transparent;

  </style>
</head>
<body class="text-slate-800 pb-24 max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl relative">

  <script>
    // =========================================================================

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 pt-3 pb-2">
    <div class="flex items-center justify-between mb-2">
      <div>
        <div class="flex items-center gap-1.5">
          <span class="bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">14명 · 3가족</span>
          <span id="syncBadge" class="bg-slate-100 text-slate-500 text-[10px] font-semibold px-2 py-0.5 rounded-full">연결 확인 중...</span>
        </div>
        <h1 class="text-lg font-extrabold text-slate-900 mt-0.5">펜션 장보기 & N빵 정산</h1>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="manualRefresh()" title="최신 내역 새로고침" class="p-2 rounded-lg text-slate-500 hover:text-emerald-600 hover:bg-slate-100 transition">
          <i id="refreshIcon" class="fa-solid fa-arrows-rotate text-sm"></i>
        </button>
        <button onclick="resetAllData()" title="초기 리스트로 되돌리기" class="p-2 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-slate-100 transition">
          <i class="fa-solid fa-trash-can-arrow-up text-sm"></i>
        </button>
      </div>
    </div>

    <!-- 메인 탭 전환 -->
    <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl text-sm font-bold">
      <button id="tabShopping" onclick="switchTab('shopping')" class="py-2 rounded-lg bg-white text-emerald-700 shadow-sm transition">
        <i class="fa-solid fa-cart-shopping mr-1"></i> 장보기 체크
      </button>
      <button id="tabSettlement" onclick="switchTab('settlement')" class="py-2 rounded-lg text-slate-500 hover:text-slate-700 transition">
        <i class="fa-solid fa-calculator mr-1"></i> 3가족 정산
      </button>
    </div>
  </header>

  <!-- ==================== 1. 장보기 체크 탭 ==================== -->
  <main id="viewShopping" class="px-4 pt-3 space-y-4">
    <!-- 요약 대시보드 -->
    <div class="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-2xl p-4 text-white shadow-md">
      <div class="flex justify-between items-end mb-2">
        <div>
          <p class="text-emerald-100 text-xs font-medium">장보기 진행률</p>
          <p class="text-2xl font-extrabold tracking-tight">
            <span id="checkedCount">0</span><span class="text-base font-normal text-emerald-100"> / <span id="totalCount">0</span>개 완료</span>
          </p>
        </div>
        <div class="text-right">
          <p class="text-emerald-100 text-xs font-medium">체크된 합계 / 전체 예상</p>
          <p class="text-sm font-bold">
            <span id="checkedAmount">0</span>원 <span class="text-emerald-200 font-normal">/ <span id="totalAmount">0</span>원</span>
          </p>
        </div>
      </div>
      <div class="w-full bg-black/20 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-amber-300 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <div class="flex justify-between items-center mt-3 pt-2.5 border-t border-white/15 text-xs">
        <span class="text-emerald-100"><i class="fa-solid fa-star text-amber-300 mr-1"></i>미구매 필수: <strong id="mustBuyRemainCount" class="text-amber-300">0</strong>개</span>
        <button onclick="copyShoppingText()" class="bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-lg font-semibold transition">
          <i class="fa-regular fa-copy mr-1"></i>카톡 복사
        </button>
      </div>
    </div>

    <!-- 필터 바 -->
    <div class="flex items-center justify-between gap-1.5">
      <div class="flex gap-1 text-xs font-semibold overflow-x-auto no-scrollbar">
        <button onclick="setFilter('all')" id="filterAll" class="px-2.5 py-1.5 rounded-full bg-slate-800 text-white shrink-0">전체</button>
        <button onclick="setFilter('must')" id="filterMust" class="px-2.5 py-1.5 rounded-full bg-white text-rose-600 border border-rose-200 shrink-0">★ 필수만</button>
        <button onclick="setFilter('unchecked')" id="filterUnchecked" class="px-2.5 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 shrink-0">미완료</button>
        <button onclick="setFilter('checked')" id="filterChecked" class="px-2.5 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 shrink-0">완료됨</button>
      </div>
      <button onclick="openItemModal()" class="text-xs font-bold bg-emerald-600 text-white px-3 py-1.5 rounded-full shadow-sm hover:bg-emerald-700 transition shrink-0">
        <i class="fa-solid fa-plus mr-1"></i>추가
      </button>
    </div>

    <!-- 카테고리별 체크리스트 컨테이너 -->
    <div id="shoppingListContainer" class="space-y-4"></div>
  </main>

  <!-- ==================== 2. 3가족 정산 탭 ==================== -->
  <main id="viewSettlement" class="hidden px-4 pt-3 space-y-4">
    <!-- 가족 이름 & 인원 설정 카드 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-extrabold text-slate-800"><i class="fa-solid fa-users text-emerald-600 mr-1.5"></i>가족별 이름 및 인원 (총 14명)</h2>
        <span class="text-[11px] text-slate-400">터치해 이름 수정</span>
      </div>
      <div class="space-y-2.5" id="familySettingsContainer"></div>
    </div>

    <!-- 정산 기준 선택 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <h2 class="text-sm font-extrabold text-slate-800 mb-2.5"><i class="fa-solid fa-scale-balanced text-indigo-600 mr-1.5"></i>정산 방식 선택</h2>
      <div class="grid grid-cols-2 gap-2 text-xs font-bold mb-3">
        <button id="modeEqual" onclick="setSplitMode('equal')" class="p-2.5 rounded-xl border-2 border-emerald-600 bg-emerald-50 text-emerald-800 text-left">
          <div>균등 1/3 N빵</div>
          <div class="text-[11px] font-normal text-emerald-600 mt-0.5">세 가족 동일하게 분담</div>
        </button>
        <button id="modeHeadcount" onclick="setSplitMode('headcount')" class="p-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 text-left">
          <div>인원수 비례 정산</div>
          <div class="text-[11px] font-normal text-slate-400 mt-0.5">어른·초등 비율 반영</div>
        </button>
      </div>
      <div id="childWeightBox" class="hidden bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex items-center justify-between text-xs">
        <span class="font-semibold text-slate-600">초등학생 1인 가중치</span>
        <div class="flex gap-1.5">
          <button onclick="setChildWeight(0.5)" id="cw05" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold">0.5명</button>
          <button onclick="setChildWeight(0.7)" id="cw07" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-600 font-bold">0.7명</button>
          <button onclick="setChildWeight(1.0)" id="cw10" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-600 font-bold">1.0명</button>
        </div>
      </div>
    </div>

    <!-- 추가 공용 지출 (숙소비, 숯불비, 주류 등) -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="text-sm font-extrabold text-slate-800"><i class="fa-solid fa-receipt text-amber-500 mr-1.5"></i>별도 결제 내역 (숙소·주류 등)</h2>
        <button onclick="openExtraExpenseModal()" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg hover:bg-indigo-100">
          + 영수증 추가
        </button>
      </div>
      <div id="extraExpensesList" class="space-y-2 text-xs"></div>
    </div>

    <!-- 최종 정산 결과 카드 -->
    <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-lg space-y-3">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2.5">
        <div>
          <p class="text-xs text-slate-400">총 지출 합계 (장보기 + 별도)</p>
          <p id="grandTotalDisplay" class="text-2xl font-extrabold text-amber-300">0원</p>
        </div>
        <button onclick="copySettlementText()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold text-xs px-3 py-2 rounded-xl transition">
          <i class="fa-regular fa-copy mr-1"></i>정산서 카톡 복사
        </button>
      </div>

      <!-- 가족별 지출/부담 요약 -->
      <div id="familyBreakdown" class="space-y-2 text-xs"></div>

      <!-- 최종 송금 가이드 -->
      <div class="bg-slate-800 rounded-xl p-3 space-y-2">
        <p class="text-xs font-bold text-emerald-400"><i class="fa-solid fa-paper-plane mr-1"></i>최종 송금 안내</p>
        <div id="transferInstructions" class="space-y-1.5 text-sm font-bold"></div>
      </div>
    </div>
  </main>

  <!-- ==================== 품목 추가/수정 모달 ==================== -->
  <div id="itemModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 id="itemModalTitle" class="text-base font-extrabold text-slate-900">장보기 품목 추가</h3>
        <button onclick="closeItemModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <input type="hidden" id="editItemId" />
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">카테고리</label>
          <select id="itemCategory" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white font-medium">

            <option value="정육 (마트/정육점)">정육 (마트/정육점)</option>
            <option value="식사 & 사리">식사 & 사리</option>
            <option value="곁들임 & 소스">곁들임 & 소스</option>
            <option value="음료 & 과일">음료 & 과일</option>
            <option value="간식 & 디저트">간식 & 디저트</option>
            <option value="일회용품 & 기타">일회용품 & 기타</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">품목명</label>
          <input type="text" id="itemName" placeholder="예: 삼겹살 + 목살" class="w-full border border-slate-300 rounded-xl px-3 py-2.5" />
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">수량 / 메모</label>
            <input type="text" id="itemNote" placeholder="예: 2.5kg" class="w-full border border-slate-300 rounded-xl px-3 py-2.5" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">금액 (원)</label>
            <input type="number" id="itemPrice" placeholder="0" class="w-full border border-slate-300 rounded-xl px-3 py-2.5" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">결제한 가족</label>
          <select id="itemPayer" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white font-medium"></select>
        </div>
        <label class="flex items-center gap-2.5 p-3 rounded-xl bg-rose-50 border border-rose-200 cursor-pointer select-none">
          <input type="checkbox" id="itemMustBuy" class="w-4 h-4 accent-rose-600 rounded" />
          <span class="text-xs font-extrabold text-rose-700"><i class="fa-solid fa-star text-rose-500 mr-1"></i>아직 안 샀지만 꼭 사야 하는 필수 품목</span>
        </label>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeItemModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">취소</button>
        <button onclick="saveItem()" class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700">저장하기</button>
      </div>
    </div>
  </div>

  <!-- ==================== 별도 지출 추가 모달 ==================== -->
  <div id="extraModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-extrabold text-slate-900">별도 공용 지출 추가</h3>
        <button onclick="closeExtraExpenseModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">지출 내역</label>
          <input type="text" id="extraTitle" placeholder="예: 펜션 숯불바비큐 이용료, 주류 등" class="w-full border border-slate-300 rounded-xl px-3 py-2.5" />
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">금액 (원)</label>
            <input type="number" id="extraAmount" placeholder="30000" class="w-full border border-slate-300 rounded-xl px-3 py-2.5" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">결제한 가족</label>
            <select id="extraPayer" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white font-medium"></select>
          </div>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeExtraExpenseModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">취소</button>
        <button onclick="saveExtraExpense()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm">추가하기</button>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 -->

    <button id="toastUndoBtn" onclick="undoDelete()" class="hidden text-amber-300 underline ml-1">실행 취소</button>

        { id: '20', category: '일회용품 & 기타', name: '일회용품 세트', note: '종이컵, 접시, 나무젓가락, 물티슈, 키친타월', price: 8000, checked: false, mustBuy: true, payer: 0 }
      ],
      extraExpenses: []
    };

    const STORAGE_KEY = 'pension_trip_3families_shared_v1';
    let state = loadLocalState();
    let currentFilter = 'all';
    let lastDeleted = null;
    let supabaseClient = null;
    let isCloudConnected = false;

    function loadLocalState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    async function saveState(pushRemote = true) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
      if (pushRemote && isCloudConnected && supabaseClient) {
        await pushToCloud();
      }
    }

    // ==================== 클라우드 자동 동기화 ====================
    async function initCloudSync() {
      const hasValidKeys =
        typeof SUPABASE_URL === 'string' &&
        SUPABASE_URL.startsWith('https://') &&
        typeof SUPABASE_ANON_KEY === 'string' &&
        SUPABASE_ANON_KEY.length > 20;

      if (!hasValidKeys || !window.supabase) {
        updateSyncBadge('local');
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        updateSyncBadge('syncing');

        await fetchFromCloud(true);

        supabaseClient
          .channel('pension_sync_channel')
          .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'pension_trip_state',
            filter: `id=eq.${TRIP_DOC_ID}`
          }, payload => {
            if (payload.new && payload.new.payload) {
              state = payload.new.payload;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              renderAll();
              showToast('다른 가족이 내역을 업데이트했습니다.');
            }
          })
          .subscribe();

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && isCloudConnected) {
            fetchFromCloud(false);
          }
        });

        isCloudConnected = true;
        updateSyncBadge('connected');
      } catch (err) {
        console.error('Cloud sync error:', err);
        isCloudConnected = false;
        updateSyncBadge('error');
      }
    }

    async function fetchFromCloud(initIfEmpty = false) {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient
        .from('pension_trip_state')
        .select('payload')
        .eq('id', TRIP_DOC_ID)
        .maybeSingle();

      if (error) throw error;

      if (data && data.payload) {
        state = data.payload;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderAll();
      } else if (initIfEmpty) {
        await pushToCloud();
      }
    }

    async function pushToCloud() {
      if (!supabaseClient) return;
      updateSyncBadge('syncing');
      const { error } = await supabaseClient
        .from('pension_trip_state')
        .upsert({
          id: TRIP_DOC_ID,
          payload: state,
          updated_at: new Date().toISOString()
        });
      updateSyncBadge(error ? 'error' : 'connected');
    }

    async function manualRefresh() {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');
      if (isCloudConnected) {
        await fetchFromCloud(false);
        showToast('최신 공용 내역을 불러왔습니다.');
      } else {
        renderAll();
        showToast('로컬 내역이 새로고침되었습니다.');
      }
      setTimeout(() => icon.classList.remove('fa-spin'), 500);
    }

    function updateSyncBadge(status) {
      const badge = document.getElementById('syncBadge');
      if (status === 'connected') {
        badge.className = 'bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded-full';
        badge.innerHTML = '<i class="fa-solid fa-cloud mr-1"></i>실시간 공유 중';
      } else if (status === 'syncing') {
        badge.className = 'bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-full';
        badge.textContent = '동기화 중...';
      } else if (status === 'error') {
        badge.className = 'bg-rose-100 text-rose-700 text-[10px] font-bold px-2 py-0.5 rounded-full';
        badge.textContent = 'DB 연결 오류';
      } else {
        badge.className = 'bg-slate-100 text-slate-500 text-[10px] font-semibold px-2 py-0.5 rounded-full';
        badge.textContent = '로컬 전용 모드';
      }
    }

    // ==================== UI 및 리스트 로직 ====================
    function switchTab(tab) {
      const isShop = tab === 'shopping';
      document.getElementById('viewShopping').classList.toggle('hidden', !isShop);
      document.getElementById('viewSettlement').classList.toggle('hidden', isShop);

      document.getElementById('tabShopping').className = isShop
        ? 'py-2 rounded-lg bg-white text-emerald-700 shadow-sm transition'
        : 'py-2 rounded-lg text-slate-500 hover:text-slate-700 transition';
      document.getElementById('tabSettlement').className = !isShop
        ? 'py-2 rounded-lg bg-white text-indigo-700 shadow-sm transition'
        : 'py-2 rounded-lg text-slate-500 hover:text-slate-700 transition';
    }

    function setFilter(f) {
      currentFilter = f;
      const styles = {
        all: ['bg-slate-800 text-white', 'bg-white text-slate-600 border border-slate-200'],
        must: ['bg-rose-600 text-white', 'bg-white text-rose-600 border border-rose-200'],
        unchecked: ['bg-slate-800 text-white', 'bg-white text-slate-600 border border-slate-200'],
        checked: ['bg-slate-800 text-white', 'bg-white text-slate-600 border border-slate-200']
      };
      ['all', 'must', 'unchecked', 'checked'].forEach(key => {
        const btn = document.getElementById('filter' + key.charAt(0).toUpperCase() + key.slice(1));
        btn.className = 'px-2.5 py-1.5 rounded-full shrink-0 ' + (key === f ? styles[key][0] : styles[key][1]);
      });
      renderShoppingList();
    }

    function renderShoppingList() {
      const container = document.getElementById('shoppingListContainer');
      const totalItems = state.items.length;
      const checkedItems = state.items.filter(i => i.checked).length;
      const mustBuyRemain = state.items.filter(i => i.mustBuy && !i.checked).length;
      const totalAmt = state.items.reduce((s, i) => s + (Number(i.price) || 0), 0);
      const checkedAmt = state.items.filter(i => i.checked).reduce((s, i) => s + (Number(i.price) || 0), 0);

      document.getElementById('checkedCount').textContent = checkedItems;
      document.getElementById('totalCount').textContent = totalItems;
      document.getElementById('mustBuyRemainCount').textContent = mustBuyRemain;
      document.getElementById('checkedAmount').textContent = checkedAmt.toLocaleString();
      document.getElementById('totalAmount').textContent = totalAmt.toLocaleString();
      const pct = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);
      document.getElementById('progressBar').style.width = pct + '%';

      const filtered = state.items.filter(item => {
        if (currentFilter === 'must') return !!item.mustBuy;
        if (currentFilter === 'unchecked') return !item.checked;
        if (currentFilter === 'checked') return item.checked;
        return true;
      });

      const categories = [...new Set(filtered.map(i => i.category))];
      if (categories.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm bg-white rounded-2xl border border-slate-200">표시할 품목이 없습니다.</div>`;
        return;
      }

      const payerColors = [
        'bg-emerald-50 text-emerald-700 border-emerald-200',
        'bg-sky-50 text-sky-700 border-sky-200',
        'bg-amber-50 text-amber-700 border-amber-200'
      ];

      container.innerHTML = categories.map(cat => {
        const catItems = filtered.filter(i => i.category === cat);
        const rows = catItems.map(item => {
          const famName = state.families[item.payer]?.name || '가족 1';
          const badgeClass = payerColors[item.payer % 3];
          const isMust = !!item.mustBuy;
          const cardBorder = item.checked
            ? 'border-slate-100 bg-slate-50/70'
            : isMust
              ? 'border-rose-300 bg-rose-50/30 shadow-xs'
              : 'border-slate-200 bg-white shadow-xs';

          return `
            <div class="flex items-center justify-between p-3 rounded-xl border ${cardBorder} transition">
              <div onclick="toggleItem('${item.id}')" class="flex items-start gap-2.5 flex-1 cursor-pointer select-none pr-1.5">
                <div class="mt-0.5 w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 transition ${item.checked ? 'bg-emerald-600 border-emerald-600 text-white' : isMust ? 'border-rose-400 bg-white' : 'border-slate-300 bg-white'}">
                  ${item.checked ? '<i class="fa-solid fa-check text-[11px]"></i>' : ''}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    ${isMust && !item.checked ? '<span class="bg-rose-600 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded leading-none">필수</span>' : ''}
                    <p class="text-sm font-bold leading-snug ${item.checked ? 'line-through text-slate-400' : 'text-slate-800'}">${escapeHtml(item.name)}</p>
                  </div>
                  <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5 text-xs ${item.checked ? 'text-slate-400' : 'text-slate-500'}">
                    ${item.note ? `<span>${escapeHtml(item.note)}</span>` : ''}
                    <span class="font-semibold ${item.checked ? 'text-slate-400' : 'text-slate-700'}">${(Number(item.price) || 0).toLocaleString()}원</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="toggleMustBuy('${item.id}')" title="꼭 사야 할 필수 품목 지정/해제"
                  class="px-1.5 py-1 rounded-lg border text-[11px] font-bold transition ${isMust ? 'bg-rose-100 text-rose-700 border-rose-300' : 'bg-slate-50 text-slate-400 border-slate-200 hover:text-rose-500'}">
                  <i class="fa-${isMust ? 'solid' : 'regular'} fa-star"></i>
                </button>
                <button onclick="cyclePayer('${item.id}')" title="결제 가족 변경" class="text-[11px] font-bold px-2 py-1 rounded-lg border ${badgeClass} active:scale-95 transition">
                  ${escapeHtml(famName)}
                </button>
                <button onclick="openItemModal('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600">
                  <i class="fa-solid fa-pen text-xs"></i>
                </button>
                <button onclick="deleteItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-500">
                  <i class="fa-solid fa-trash text-xs"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <section class="space-y-2">
            <div class="flex items-center justify-between px-1">
              <h3 class="text-xs font-extrabold text-slate-500 uppercase tracking-wider">${escapeHtml(cat)}</h3>
              <span class="text-[11px] font-semibold text-slate-400">${catItems.filter(i=>i.checked).length}/${catItems.length}</span>
            </div>
            <div class="space-y-2">${rows}</div>
          </section>
        `;
      }).join('');
    }

    function toggleItem(id) {
      const item = state.items.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        saveState();
      }
    }

    function toggleMustBuy(id) {
      const item = state.items.find(i => i.id === id);
      if (item) {
        item.mustBuy = !item.mustBuy;
        saveState();
        showToast(item.mustBuy ? '★ 꼭 사야 할 필수 품목으로 지정했습니다.' : '필수 지정이 해제되었습니다.');
      }
    }

    function cyclePayer(id) {
      const item = state.items.find(i => i.id === id);
      if (item) {
        item.payer = (item.payer + 1) % 3;
        saveState();
      }
    }

    function deleteItem(id) {
      const idx = state.items.findIndex(i => i.id === id);
      if (idx > -1) {
        lastDeleted = { item: state.items[idx], index: idx };
        state.items.splice(idx, 1);
        saveState();
        showToast('품목이 삭제되었습니다.', true);
      }
    }

    function undoDelete() {
      if (lastDeleted) {
        state.items.splice(lastDeleted.index, 0, lastDeleted.item);
        lastDeleted = null;
        saveState();
        hideToast();
      }
    }

    function openItemModal(id = null) {
      const payerSelect = document.getElementById('itemPayer');
      payerSelect.innerHTML = state.families.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');

      if (id) {
        const item = state.items.find(i => i.id === id);
        document.getElementById('itemModalTitle').textContent = '장보기 품목 수정';
        document.getElementById('editItemId').value = item.id;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemNote').value = item.note;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemPayer').value = item.payer;
        document.getElementById('itemMustBuy').checked = !!item.mustBuy;
      } else {
        document.getElementById('itemModalTitle').textContent = '새 장보기 품목 추가';
        document.getElementById('editItemId').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemNote').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemPayer').value = 0;
        document.getElementById('itemMustBuy').checked = true;
      }
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeItemModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function saveItem() {
      const id = document.getElementById('editItemId').value;
      const category = document.getElementById('itemCategory').value;
      const name = document.getElementById('itemName').value.trim();
      const note = document.getElementById('itemNote').value.trim();
      const price = parseInt(document.getElementById('itemPrice').value, 10) || 0;
      const payer = parseInt(document.getElementById('itemPayer').value, 10) || 0;
      const mustBuy = document.getElementById('itemMustBuy').checked;

      if (!name) {
        alert('품목명을 입력해 주세요.');
        return;
      }

      if (id) {
        const item = state.items.find(i => i.id === id);
        if (item) Object.assign(item, { category, name, note, price, payer, mustBuy });
      } else {
        state.items.push({
          id: Date.now().toString(),
          category, name, note, price, checked: false, mustBuy, payer
        });
      }
      closeItemModal();
      saveState();
      showToast(id ? '품목이 수정되었습니다.' : '새 품목이 추가되었습니다.');
    }

    // ==================== 정산 탭 로직 ====================
    function renderSettlement() {
      const famContainer = document.getElementById('familySettingsContainer');
      famContainer.innerHTML = state.families.map(f => `
        <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 text-xs">
          <input type="text" value="${escapeHtml(f.name)}" onchange="updateFamilyName(${f.id}, this.value)"
            class="font-bold text-slate-800 bg-transparent border-b border-dashed border-slate-300 focus:border-emerald-600 outline-none w-24 py-0.5" />
          <div class="flex items-center gap-3 text-slate-600">
            <div class="flex items-center gap-1">
              <span>성인</span>
              <button onclick="changeMember(${f.id}, 'adults', -1)" class="w-5 h-5 rounded bg-white border border-slate-300 font-bold">-</button>
              <span class="w-4 text-center font-bold">${f.adults}</span>
              <button onclick="changeMember(${f.id}, 'adults', 1)" class="w-5 h-5 rounded bg-white border border-slate-300 font-bold">+</button>
            </div>
            <div class="flex items-center gap-1">
              <span>초등</span>
              <button onclick="changeMember(${f.id}, 'kids', -1)" class="w-5 h-5 rounded bg-white border border-slate-300 font-bold">-</button>
              <span class="w-4 text-center font-bold">${f.kids}</span>
              <button onclick="changeMember(${f.id}, 'kids', 1)" class="w-5 h-5 rounded bg-white border border-slate-300 font-bold">+</button>
            </div>
          </div>
        </div>
      `).join('');

      const isEqual = state.splitMode === 'equal';
      document.getElementById('modeEqual').className = isEqual
        ? 'p-2.5 rounded-xl border-2 border-emerald-600 bg-emerald-50 text-emerald-800 text-left'
        : 'p-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 text-left';
      document.getElementById('modeHeadcount').className = !isEqual
        ? 'p-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-800 text-left'
        : 'p-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 text-left';
      document.getElementById('childWeightBox').classList.toggle('hidden', isEqual);

      [0.5, 0.7, 1.0].forEach(w => {
        const btn = document.getElementById('cw' + String(w).replace('.', ''));
        if (btn) {
          btn.className = state.childWeight === w
            ? 'px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold'
            : 'px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-600 font-bold';
        }
      });

      const extraList = document.getElementById('extraExpensesList');
      if (state.extraExpenses.length === 0) {
        extraList.innerHTML = `<p class="text-slate-400 text-center py-2">추가된 별도 지출이 없습니다.</p>`;
      } else {
        extraList.innerHTML = state.extraExpenses.map(ex => `
          <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
            <div>
              <span class="font-bold text-slate-800">${escapeHtml(ex.title)}</span>
              <span class="text-slate-400 ml-1.5">(${escapeHtml(state.families[ex.payer]?.name || '가족 1')})</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-700">${Number(ex.amount).toLocaleString()}원</span>
              <button onclick="deleteExtraExpense('${ex.id}')" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
        `).join('');
      }

      const paidByFamily = [0, 0, 0];
      state.items.forEach(i => paidByFamily[i.payer] += (Number(i.price) || 0));
      state.extraExpenses.forEach(ex => paidByFamily[ex.payer] += (Number(ex.amount) || 0));

      const grandTotal = paidByFamily.reduce((a, b) => a + b, 0);
      document.getElementById('grandTotalDisplay').textContent = grandTotal.toLocaleString() + '원';

      let shares = [0, 0, 0];
      if (isEqual) {
        const each = Math.round(grandTotal / 3);
        shares = [each, each, grandTotal - each * 2];
      } else {
        const weights = state.families.map(f => f.adults + f.kids * state.childWeight);
        const totalWeight = weights.reduce((a, b) => a + b, 0) || 1;
        shares = weights.map(w => Math.round((grandTotal * w) / totalWeight));
        shares[0] += grandTotal - shares.reduce((a, b) => a + b, 0);
      }

      const balances = state.families.map((f, idx) => ({
        id: f.id,
        name: f.name,
        paid: paidByFamily[idx],
        share: shares[idx],
        net: paidByFamily[idx] - shares[idx]
      }));

      document.getElementById('familyBreakdown').innerHTML = balances.map(b => {
        const statusText = b.net > 0
          ? `<span class="text-emerald-400 font-bold">+${b.net.toLocaleString()}원 받기</span>`
          : b.net < 0
            ? `<span class="text-rose-400 font-bold">${Math.abs(b.net).toLocaleString()}원 보내기</span>`
            : `<span class="text-slate-400">정산 완료</span>`;
        return `
          <div class="flex justify-between items-center bg-slate-800/60 px-3 py-2 rounded-lg">
            <div>
              <span class="font-bold text-white">${escapeHtml(b.name)}</span>
              <span class="text-slate-400 text-[11px] ml-1.5">결제 ${b.paid.toLocaleString()}원 / 부담 ${b.share.toLocaleString()}원</span>
            </div>
            <div>${statusText}</div>
          </div>
        `;
      }).join('');

      const debtors = balances.filter(b => b.net < -10).map(b => ({ name: b.name, amt: -b.net }));
      const creditors = balances.filter(b => b.net > 10).map(b => ({ name: b.name, amt: b.net }));
      const transfers = [];
      let d = 0, c = 0;
      while (d < debtors.length && c < creditors.length) {
        const move = Math.min(debtors[d].amt, creditors[c].amt);
        transfers.push(`${debtors[d].name} → ${creditors[c].name} : <span class="text-amber-300">${Math.round(move).toLocaleString()}원</span>`);
        debtors[d].amt -= move;
        creditors[c].amt -= move;
        if (debtors[d].amt <= 10) d++;
        if (creditors[c].amt <= 10) c++;
      }

      document.getElementById('transferInstructions').innerHTML = transfers.length > 0
        ? transfers.map(t => `<div class="flex items-center gap-2"><i class="fa-solid fa-arrow-right text-emerald-400 text-xs"></i><span>${t}</span></div>`).join('')
        : `<p class="text-xs text-slate-400 font-normal">추가로 주고받을 정산 금액이 없습니다.</p>`;
    }

    function updateFamilyName(id, val) {
      const name = val.trim();
      if (name) {
        state.families[id].name = name;
        saveState();
      }
    }

    function changeMember(id, type, delta) {
      const next = state.families[id][type] + delta;
      if (next >= 0 && next <= 10) {
        state.families[id][type] = next;
        saveState();
      }
    }

    function setSplitMode(mode) {
      state.splitMode = mode;
      saveState();
    }

    function setChildWeight(w) {
      state.childWeight = w;
      saveState();
    }

    function openExtraExpenseModal() {
      const sel = document.getElementById('extraPayer');
      sel.innerHTML = state.families.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
      document.getElementById('extraTitle').value = '';
      document.getElementById('extraAmount').value = '';
      document.getElementById('extraModal').classList.remove('hidden');
    }

    function closeExtraExpenseModal() {
      document.getElementById('extraModal').classList.add('hidden');
    }

    function saveExtraExpense() {
      const title = document.getElementById('extraTitle').value.trim();
      const amount = parseInt(document.getElementById('extraAmount').value, 10) || 0;
      const payer = parseInt(document.getElementById('extraPayer').value, 10) || 0;
      if (!title || amount <= 0) {
        alert('지출 내역과 금액을 입력해 주세요.');
        return;
      }
      state.extraExpenses.push({ id: Date.now().toString(), title, amount, payer });
      closeExtraExpenseModal();
      saveState();
    }

    function deleteExtraExpense(id) {
      state.extraExpenses = state.extraExpenses.filter(e => e.id !== id);
      saveState();
    }

    function copyShoppingText() {
      const categories = [...new Set(state.items.map(i => i.category))];
      let lines = ['🛒 [3가족 펜션 장보기 리스트]', ''];
      categories.forEach(cat => {
        lines.push(`[${cat}]`);
        state.items.filter(i => i.category === cat).forEach(i => {
          const mark = i.checked ? '✅' : '⬜';
          const mustTag = (i.mustBuy && !i.checked) ? '[필수] ' : '';
          const fam = state.families[i.payer]?.name || '';
          lines.push(`${mark} ${mustTag}${i.name}${i.note ? ' (' + i.note + ')' : ''} - ${Number(i.price).toLocaleString()}원 [${fam}]`);
        });
        lines.push('');
      });
      copyToClipboard(lines.join('\n'), '장보기 리스트가 복사되었습니다.');
    }

    function copySettlementText() {
      const paidByFamily = [0, 0, 0];
      state.items.forEach(i => paidByFamily[i.payer] += (Number(i.price) || 0));
      state.extraExpenses.forEach(ex => paidByFamily[ex.payer] += (Number(ex.amount) || 0));
      const grandTotal = paidByFamily.reduce((a, b) => a + b, 0);

      let shares = [0, 0, 0];
      if (state.splitMode === 'equal') {
        const each = Math.round(grandTotal / 3);
        shares = [each, each, grandTotal - each * 2];
      } else {
        const weights = state.families.map(f => f.adults + f.kids * state.childWeight);
        const totalWeight = weights.reduce((a, b) => a + b, 0) || 1;
        shares = weights.map(w => Math.round((grandTotal * w) / totalWeight));
        shares[0] += grandTotal - shares.reduce((a, b) => a + b, 0);
      }

      const balances = state.families.map((f, idx) => ({
        name: f.name,
        paid: paidByFamily[idx],
        share: shares[idx],
        net: paidByFamily[idx] - shares[idx]
      }));

      let lines = [
        '💰 [3가족 펜션 여행 정산 내역]',
        `• 총 지출 합계: ${grandTotal.toLocaleString()}원`,
        `• 정산 기준: ${state.splitMode === 'equal' ? '균등 1/3 N빵' : `인원 비례 (초등 ${state.childWeight}명 기준)`}`,
        '',
        '[가족별 결제 및 부담액]'
      ];
      balances.forEach(b => {
        lines.push(`- ${b.name}: 결제 ${b.paid.toLocaleString()}원 / 부담 ${b.share.toLocaleString()}원`);
      });

      const debtors = balances.filter(b => b.net < -10).map(b => ({ name: b.name, amt: -b.net }));
      const creditors = balances.filter(b => b.net > 10).map(b => ({ name: b.name, amt: b.net }));
      lines.push('', '[최종 송금 안내]');
      let d = 0, c = 0, hasTransfer = false;
      while (d < debtors.length && c < creditors.length) {
        const move = Math.min(debtors[d].amt, creditors[c].amt);
        lines.push(`👉 ${debtors[d].name} → ${creditors[c].name} : ${Math.round(move).toLocaleString()}원`);
        hasTransfer = true;
        debtors[d].amt -= move;
        creditors[c].amt -= move;
        if (debtors[d].amt <= 10) d++;
        if (creditors[c].amt <= 10) c++;
      }
      if (!hasTransfer) lines.push('주고받을 금액이 없습니다.');

      copyToClipboard(lines.join('\n'), '정산 결과가 카톡용으로 복사되었습니다.');
    }

    function copyToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => showToast(msg));
    }

    function resetAllData() {
      if (confirm('공용 리스트의 체크 상태와 수정 내역을 모두 초기 상태로 되돌릴까요?')) {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        saveState();
        showToast('초기 리스트로 복원되었습니다.');
      }
    }

    let toastTimer = null;
    function showToast(msg, canUndo = false) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      document.getElementById('toastUndoBtn').classList.toggle('hidden', !canUndo);
      t.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 3500);
    }

    function hideToast() {
      document.getElementById('toast').classList.add('hidden');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderAll() {
      renderShoppingList();
      renderSettlement();
    }

    // 초기화 및 클라우드 연동 시작
    renderAll();
    initCloudSync();
  </script>
</body>
</html>
